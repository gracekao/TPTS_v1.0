<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">TPTS v1.0 System Architecture</title>
  <desc id="description">Windows dashboard, Go backend, Android device controls, telemetry sources, and stress-test data flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#77d9e6"/>
    </marker>
    <style>
      .bg { fill:#0d0f18; }
      .title { fill:#f3f5fb; font:700 38px 'Segoe UI', sans-serif; }
      .subtitle { fill:#aeb6cd; font:400 18px 'Segoe UI', sans-serif; }
      .lane { fill:#151a2b; stroke:#343d59; stroke-width:2; }
      .lane-label { fill:#aeb6cd; font:700 15px 'Segoe UI', sans-serif; letter-spacing:1px; }
      .node { fill:#191d2d; stroke:#465273; stroke-width:2; }
      .node-title { fill:#f3f5fb; font:700 22px 'Segoe UI', sans-serif; }
      .node-text { fill:#cbd0de; font:400 16px 'Segoe UI', sans-serif; }
      .accent-cyan { fill:#18d8ed; }
      .accent-orange { fill:#ff9d6c; }
      .accent-green { fill:#34d399; }
      .accent-pink { fill:#f472b6; }
      .flow { fill:none; stroke:#77d9e6; stroke-width:3; marker-end:url(#arrow); }
      .flow-label { fill:#77d9e6; font:600 15px 'Segoe UI', sans-serif; }
      .small { fill:#8990aa; font:400 14px 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="80" y="75">TPTS v1.0 System Architecture</text>
  <text class="subtitle" x="80" y="110">Thermal and Power Tuning System for Android Intel platforms</text>

  <rect class="lane" x="70" y="155" width="420" height="660" rx="8"/>
  <text class="lane-label" x="100" y="195">WINDOWS HOST</text>
  <rect class="node" x="105" y="230" width="350" height="145" rx="8"/>
  <rect class="accent-cyan" x="105" y="230" width="8" height="145" rx="4"/>
  <text class="node-title" x="140" y="275">start.bat</text>
  <text class="node-text" x="140" y="310">Starts ADB daemon</text>
  <text class="node-text" x="140" y="338">Launches local backend</text>
  <rect class="node" x="105" y="470" width="350" height="235" rx="8"/>
  <rect class="accent-orange" x="105" y="470" width="8" height="235" rx="4"/>
  <text class="node-title" x="140" y="515">Web Dashboard</text>
  <text class="node-text" x="140" y="552">Device Connection</text>
  <text class="node-text" x="140" y="580">Live Monitor and Charts</text>
  <text class="node-text" x="140" y="608">Thermal Tune</text>
  <text class="node-text" x="140" y="636">Power, Fan, Stress Test</text>

  <rect class="lane" x="590" y="155" width="420" height="660" rx="8"/>
  <text class="lane-label" x="620" y="195">TPTS BACKEND</text>
  <rect class="node" x="625" y="315" width="350" height="300" rx="8"/>
  <rect class="accent-cyan" x="625" y="315" width="8" height="300" rx="4"/>
  <text class="node-title" x="660" y="360">Go Backend</text>
  <text class="node-text" x="660" y="402">HTTP dashboard server</text>
  <text class="node-text" x="660" y="434">WebSocket command channel</text>
  <text class="node-text" x="660" y="466">ADB command execution</text>
  <text class="node-text" x="660" y="498">Device runtime preparation</text>
  <text class="node-text" x="660" y="530">Telemetry and test output</text>

  <rect class="lane" x="1110" y="155" width="420" height="660" rx="8"/>
  <text class="lane-label" x="1140" y="195">ANDROID DEVICE</text>
  <rect class="node" x="1145" y="230" width="350" height="170" rx="8"/>
  <rect class="accent-green" x="1145" y="230" width="8" height="170" rx="4"/>
  <text class="node-title" x="1180" y="275">Device Runtime</text>
  <text class="node-text" x="1180" y="312">iotools and msr.ko</text>
  <text class="node-text" x="1180" y="340">ectool fan control</text>
  <text class="node-text" x="1180" y="368">stressapptest workload</text>
  <rect class="node" x="1145" y="495" width="350" height="245" rx="8"/>
  <rect class="accent-pink" x="1145" y="495" width="8" height="245" rx="4"/>
  <text class="node-title" x="1180" y="540">Hardware Interfaces</text>
  <text class="node-text" x="1180" y="578">thermal_zone: temperatures</text>
  <text class="node-text" x="1180" y="610">RAPL: energy_uj power</text>
  <text class="node-text" x="1180" y="642">MSR 0x610 / 0x601: PL limits</text>
  <text class="node-text" x="1180" y="674">MSR 0x19C: throttle status</text>
  <text class="node-text" x="1180" y="706">Fan RPM and policy</text>

  <path class="flow" d="M 280 375 L 280 465"/>
  <text class="flow-label" x="300" y="425">opens browser</text>
  <path class="flow" d="M 455 590 L 615 590"/>
  <text class="flow-label" x="488" y="570">WebSocket</text>
  <path class="flow" d="M 975 440 L 1135 440"/>
  <text class="flow-label" x="1000" y="420">ADB or local shell</text>
  <path class="flow" d="M 1320 400 L 1320 485"/>
  <text class="flow-label" x="1340" y="450">read / write</text>
  <path class="flow" d="M 1135 760 C 1015 820, 585 820, 465 730"/>
  <text class="flow-label" x="740" y="830">telemetry, test status, and logs</text>

  <text class="small" x="80" y="865">Primary flow: start.bat → dashboard → WebSocket backend → ADB/local shell → Android telemetry and controls</text>
</svg>